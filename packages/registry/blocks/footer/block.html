<!--
  footer
  Root carries the variant and motion params as data attributes.
  Direct children of the inner grid are the reveal targets; the big wordmark rises inside a clipped wrapper.
  Links use the buttons-links underline recipe verbatim; back to top is the arrow recipe turned upward.
-->
<footer
  x-data="footer"
  data-block="footer"
  data-variant=""
  data-motion-reveal="true"
  data-motion-reveal-stagger="0.06"
  data-motion-wordmark="true"
  class="border-t border-db-border bg-db-bg text-db-fg pt-db-section px-6 lg:px-10 data-[variant=contrast]:border-transparent data-[variant=contrast]:bg-db-contrast data-[variant=contrast]:text-db-on-contrast"

    <div class="grid gap-12 lg:grid-cols-12 lg:gap-8" data-reveal-group>

            <ul data-slot="links" class="flex flex-col gap-2">

            </ul>
          </li>
          <li class="flex flex-col gap-3">
            <p data-slot="heading" class="text-sm uppercase tracking-widest opacity-60">Build</p>
            <ul data-slot="links" class="flex flex-col gap-2">
              <li><a href="#" data-slot="link" class="bg-[linear-gradient(currentColor,currentColor)] bg-size-[0%_1px] bg-right-bottom bg-no-repeat pb-px text-sm font-medium transition-[background-size] duration-(--duration-db-snappy) ease-db-move hover:bg-size-[100%_1px] hover:bg-left-bottom focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-db-accent motion-reduce:transition-none">Docs</a></li>
              <li><a href="#" data-slot="link" class="bg-[linear-gradient(currentColor,currentColor)] bg-size-[0%_1px] bg-right-bottom bg-no-repeat pb-px text-sm font-medium transition-[background-size] duration-(--duration-db-snappy) ease-db-move hover:bg-size-[100%_1px] hover:bg-left-bottom focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-db-accent motion-reduce:transition-none">CLI</a></li>

            </ul>

      <div class="flex flex-wrap items-center justify-between gap-4 border-t border-current/15 pt-6 text-sm opacity-70 lg:col-span-12">
        <p data-slot="copyright">© <span x-text="new Date().getFullYear()">2026</span> Dropblocs</p>
        <ul data-slot="legal" class="flex flex-wrap gap-6">
          <li><a href="#" data-slot="link" class="bg-[linear-gradient(currentColor,currentColor)] bg-size-[0%_1px] bg-right-bottom bg-no-repeat pb-px transition-[background-size] duration-(--duration-db-snappy) ease-db-move hover:bg-size-[100%_1px] hover:bg-left-bottom focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-db-accent motion-reduce:transition-none">Privacy</a></li>
